<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotional Offer</title>
    <style>
        body { background-color: #1e3a8a; color: #ffffff; font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; text-align: center; }
        .card { background: #2563eb; padding: 40px; border-radius: 12px; max-width: 400px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .timer { font-size: 1.2rem; font-weight: bold; background: #1d4ed8; padding: 8px 16px; border-radius: 20px; display: inline-block; margin-bottom: 20px; }
        h1 { font-size: 1.8rem; margin-bottom: 10px; }
        p { font-size: 1rem; opacity: 0.9; margin-bottom: 30px; }
        .btn { display: block; background-color: #ffffff; color: #1e3a8a; font-size: 1.2rem; font-weight: bold; text-decoration: none; padding: 16px; border-radius: 8px; transition: transform 0.1s; }
        .btn:hover { transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="card">
        <div class="timer">Offer Expires: <span id="timer">00:30</span></div>
        <h1>$100 Promotional Reward</h1>
        <p>Complete account registration to claim your standard $100 promotional credit.</p>
        <a href="https://mh6jk.bemobtrcks.com/click" class="btn">CLAIM $100 CREDIT NOW</a>
    </div>
    <script>
        let t = 30;
        const timer = document.getElementById('timer');
        const interval = setInterval(() => {
            t--;
            timer.textContent = `00:${t < 10 ? '0' : ''}${t}`;
            if (t <= 0) clearInterval(interval);
        }, 1000);
    </script>
</body>
</html>
